<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма обратной связи</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'feedback/css/styles.css' %}">
</head>
<body>
    <canvas class="particles"></canvas>

    <div class="form-container" data-aos="zoom-in">
        <form method="post" enctype="multipart/form-data" id="feedbackForm">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Тип обращения</label>
                <select class="custom-select" name="type" required>
                    <option value="">Выберите тип обращения</option>
                    <option value="suggestion">Пожелание</option>
                    <option value="problem">Проблема</option>
                    <option value="complaint">Претензия</option>
                    <option value="other">Другое</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Описание</label>
                <textarea class="textarea-field" name="description" required></textarea>
            </div>

            <div class="form-group">
                <div class="file-input-container">
                    <input type="file" class="file-input" name="attachment" id="fileInput">
                    <label for="fileInput" class="file-label">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>Перетащите файл или кликните для загрузки</span>
                        <div id="fileName"></div>
                    </label>
                </div>
            </div>

            <button type="submit" class="submit-btn">Отправить обращение</button>
        </form>

        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags %}{{ message.tags }}{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <script src="https://kit.fontawesome.com/your-kit-code.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="{% static 'feedback/js/scripts.js' %}"></script>
</body>
</html>
